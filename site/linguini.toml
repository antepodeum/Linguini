[project]
name = "linguini-site"
default_locale = "en"
locales = ["en", "ru", "es", "fr", "de", "it", "zh", "pt", "pt-BR"]

[paths]
schema = "linguini/schema"
locale = "linguini/locale"

[targets.ts]
out = "src/lib/generated/linguini"
declaration = true
framework = "sveltekit"
gitignore = false

[targets.ts.bundler]
sources = ["src"]

[web.routing]
locale_prefix = "always"
canonical = "redirect"

[web.locale]
sources = ["path", "cookie", "local-storage", "accept-language"]

[web.cookie]
name = "LINGUINI_SITE_LOCALE"
path = "/"
max_age = "365d"
same_site = "lax"
secure = false
http_only = false

[web.local_storage]
key = "LINGUINI_SITE_LOCALE"

[web.links]
mode = "runtime"

[web.routes]
exclude = ["/_app/**", "/favicon.ico", "/robots.txt"]
