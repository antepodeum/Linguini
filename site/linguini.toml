[project]
name = "linguini-site"
default_locale = "en"
locales = ["en", "ru", "es", "fr", "de", "it", "zh", "pt", "pt-BR"]

[paths]
schema = "linguini/schema"
locale = "linguini/locale"

[targets.ts]
out = "src/lib/generated/linguini"
declaration = true
gitignore = false

[targets.ts.bundler]
sources = ["src"]
locale_loading = "dynamic"

[targets.ts.bundler.dynamic]
mode = "bundle"
allow = [
  "main.hero.title",
  "main.hero.tagline",
  "main.playground.number_format",
  "main.playground.currency_format",
]
