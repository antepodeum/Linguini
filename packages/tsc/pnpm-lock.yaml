lockfileVersion: '9.0'

settings:
  autoInstallPeers: true
  excludeLinksFromLockfile: false

overrides:
  '@antepodeum/linguini-project': file:../project

importers:

  .:
    dependencies:
      '@antepodeum/linguini-project':
        specifier: file:../project
        version: file:../project
    devDependencies:
      typescript:
        specifier: 6.0.3
        version: 6.0.3

packages:

  '@antepodeum/linguini-project@file:../project':
    resolution: {directory: ../project, type: directory}
    engines: {node: '>=20'}

  smol-toml@1.7.1:
    resolution: {integrity: sha512-PPlsspAZ4jbMBu5DMFhfUGDQLu/vrL4SyBROVS37x8ynnVmFIs1VPBz1Co8Xks3TvpIaZXmU85y4DrQ+UyVFoQ==}
    engines: {node: '>= 18'}

  typescript@6.0.3:
    resolution: {integrity: sha512-y2TvuxSZPDyQakkFRPZHKFm+KKVqIisdg9/CZwm9ftvKXLP8NRWj38/ODjNbr43SsoXqNuAisEf1GdCxqWcdBw==}
    engines: {node: '>=14.17'}
    hasBin: true

snapshots:

  '@antepodeum/linguini-project@file:../project':
    dependencies:
      smol-toml: 1.7.1

  smol-toml@1.7.1: {}

  typescript@6.0.3: {}
