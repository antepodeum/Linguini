[package]
name = "linguini-lsp"
version = "0.1.0-alpha.4"
description = "Language server implementation for Linguini"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
linguini-analyzer = { path = "../linguini-analyzer", version = "0.1.0-alpha.4" }
linguini-cldr = { path = "../linguini-cldr", version = "0.1.0-alpha.4" }
linguini-config = { path = "../linguini-config", version = "0.1.0-alpha.4" }
linguini-core = { path = "../linguini-core", version = "0.1.0-alpha.4" }
linguini-format = { path = "../linguini-format", version = "0.1.0-alpha.4" }
linguini-ir = { path = "../linguini-ir", version = "0.1.0-alpha.4" }
linguini-schema = { path = "../linguini-schema", version = "0.1.0-alpha.4" }
linguini-syntax = { path = "../linguini-syntax", version = "0.1.0-alpha.4" }
serde_json = "=1.0.149"
url = "=2.5.9"
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "=1.54.1", features = ["io-std", "macros", "rt-multi-thread", "time"] }
tower-lsp-server = { package = "tower-lsp", version = "=0.20.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
percent-encoding = "=2.3.2"
tower-lsp-server = { package = "tower-lsp", version = "=0.20.0", default-features = false, features = ["runtime-agnostic"] }


[dev-dependencies]
futures = { version = "=0.3.32", default-features = false, features = ["std", "async-await"] }
tower-service = "=0.3.3"
linguini-test-support = { path = "../linguini-test-support", version = "0.1.0-alpha.4" }
