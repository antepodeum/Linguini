[package]
name = "linguini-cli"
version = "0.1.0-alpha.4"
description = "Command-line interface for Linguini localization projects"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "linguini"
path = "src/main.rs"

[dependencies]
linguini-codegen = { path = "../linguini-codegen", version = "0.1.0-alpha.4" }
linguini-codegen-ecmascript-web = { path = "../linguini-codegen-ecmascript-web", version = "0.1.0-alpha.4" }
clap = { version = "=4.5.61", features = ["derive"] }
linguini-analyzer = { path = "../linguini-analyzer", version = "0.1.0-alpha.4" }
linguini-cldr = { path = "../linguini-cldr", version = "0.1.0-alpha.4" }
linguini-codegen-ecmascript = { path = "../linguini-codegen-ecmascript", version = "0.1.0-alpha.4" }
linguini-codegen-svelte = { path = "../linguini-codegen-svelte", version = "0.1.0-alpha.4" }
linguini-codegen-sveltekit = { path = "../linguini-codegen-sveltekit", version = "0.1.0-alpha.4" }
linguini-codegen-vite = { path = "../linguini-codegen-vite", version = "0.1.0-alpha.4" }
linguini-config = { path = "../linguini-config", version = "0.1.0-alpha.4" }
linguini-format = { path = "../linguini-format", version = "0.1.0-alpha.4" }
linguini-ir = { path = "../linguini-ir", version = "0.1.0-alpha.4" }
linguini-lsp = { path = "../linguini-lsp", version = "0.1.0-alpha.4" }
linguini-schema = { path = "../linguini-schema", version = "0.1.0-alpha.4" }
linguini-syntax = { path = "../linguini-syntax", version = "0.1.0-alpha.4" }
serde_json = "=1.0.149"
sha2 = "=0.10.9"
tempfile = "=3.10.1"

[dev-dependencies]
assert_cmd = "=2.1.2"
predicates = "3.1.4"
