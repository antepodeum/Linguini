[package]
name = "linguini-codegen-ecmascript"
version = "0.1.0-alpha.4"
description = "JavaScript and TypeScript declaration generator for Linguini localization projects"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
linguini-codegen = { path = "../linguini-codegen", version = "0.1.0-alpha.4" }
linguini-cldr = { path = "../linguini-cldr", version = "0.1.0-alpha.4" }
linguini-core = { path = "../linguini-core", version = "0.1.0-alpha.4" }
linguini-ir = { path = "../linguini-ir", version = "0.1.0-alpha.4" }
linguini-syntax = { path = "../linguini-syntax", version = "0.1.0-alpha.4" }
minijinja = { version = "=2.12.0", default-features = false, features = ["builtins", "macros", "multi_template", "serde"] }

