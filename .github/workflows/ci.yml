name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  release-contract:
    name: Release contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Verify synchronized versions
        run: node packages/scripts/check-versions.mjs
      - name: Test repository runner
        run: node --test scripts/test-all.test.mjs
      - name: Enforce public contract companion evidence
        env:
          PUBLIC_CONTRACT_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: node scripts/check-public-contract.mjs

  rust:
    name: Rust workspace
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          components: clippy, rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --workspace

  coverage:
    name: Rust coverage threshold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-llvm-cov
      - name: Enforce workspace line coverage
        run: >-
          cargo llvm-cov --locked --workspace --all-targets
          --fail-under-lines 80

  properties:
    name: Parser and formatter properties
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - name: Run deterministic property suites
        run: >-
          cargo test --locked
          -p linguini-syntax -p linguini-format -p linguini-cldr -p linguini-config

  mutation:
    name: Changed-code mutation testing
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - name: Install cargo-mutants
        uses: taiki-e/install-action@67729d5c413db75907f0ad1e39bb04b9c868ff60 # v2.85.7
        with:
          tool: cargo-mutants@27.1.0
      - name: Capture pull-request diff
        run: git diff "origin/${{ github.base_ref }}"...HEAD > git.diff
      - name: Reject surviving changed-code mutants
        run: >-
          cargo mutants --no-shuffle --in-diff git.diff
          --timeout 300
  msrv:
    name: Rust 1.76 MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.76.0
      - name: Verify selected MSRV toolchain
        run: rustc +1.76.0 --version
      - name: Check workspace on MSRV
        run: cargo +1.76.0 check --locked --workspace --all-targets

  platforms:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - run: cargo test --locked --workspace

  security:
    name: Dependency policy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - uses: rustsec/audit-check@69366f33c96575abad1ee0dba8212993eecbe998 # v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  semver:
    name: Public API compatibility
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Check publishable crate APIs
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2
        with:
          baseline-rev: ${{ github.event.pull_request.base.sha || github.event.before }}
          exclude: linguini-cldr-macros, linguini-locale, linguini-test-support

  package:
    name: Package crates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - name: Dry-package every publishable crate
        run: >-
          cargo package --locked --workspace --no-verify
          --exclude linguini-cldr-macros
          --exclude linguini-locale
          --exclude linguini-test-support

  vite:
    name: Vite ${{ matrix.vite }}
    strategy:
      fail-fast: false
      matrix:
        vite: [5, 6, 7, 8]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plugins/vite/pnpm-lock.yaml
      - name: Install plugin dependencies
        working-directory: plugins/vite
        run: pnpm install --frozen-lockfile
      - name: Select tested Vite major
        working-directory: plugins/vite
        run: pnpm add --save-dev --lockfile=false "vite@^${{ matrix.vite }}.0.0"
      - name: Test plugin against real Vite
        working-directory: plugins/vite
        run: pnpm test

  site:
    name: SvelteKit site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
      - name: Install site dependencies
        working-directory: site
        run: pnpm install --frozen-lockfile
      - name: Generate site
        working-directory: site
        run: pnpm linguini:build
      - name: Test site
        working-directory: site
        run: pnpm test
      - name: Check site
        working-directory: site
        run: pnpm check
      - name: Build generated site
        working-directory: site
        run: pnpm build:generated
      - name: Verify production message graph
        working-directory: site
        run: node scripts/production-graph.test.mjs

  vscode:
    name: VS Code extension
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install, test, and compile extension
        working-directory: editors/vscode
        run: npm ci && npm test && npm run compile
