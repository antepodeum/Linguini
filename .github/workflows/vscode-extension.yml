name: Native packages and VS Code extension

on:
  workflow_dispatch:
    inputs:
      publish_ovsx:
        description: Publish platform VSIX packages to Open VSX
        type: boolean
        default: false
      publish_npm:
        description: Publish native CLI packages to npm
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  packages:
    name: Build packages
    uses: ./.github/workflows/native-packages.yml
    with:
      artifact_retention_days: 30

  publish-ovsx:
    name: Publish Open VSX
    runs-on: ubuntu-24.04
    needs: packages
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_ovsx)
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6
        with:
          version: 11.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: editors/vscode/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: editors/vscode
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: linguini-*
          path: release-assets
          merge-multiple: true
      - name: Publish native and universal VSIX packages
        shell: bash
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo 'Missing repository secret OVSX_PAT.' >&2
            exit 1
          fi
          shopt -s nullglob
          files=(../../release-assets/*.vsix)
          if (( ${#files[@]} != 7 )); then
            printf 'Expected 7 VSIX files, found %s.\n' "${#files[@]}" >&2
            exit 1
          fi
          for vsix in "${files[@]}"; do
            (cd ../../release-assets && sha256sum -c "$(basename "$vsix").sha256")
            pnpm exec ovsx publish "$vsix"
          done

  publish-npm:
    name: Publish native npm packages
    runs-on: ubuntu-24.04
    needs: packages
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: linguini-*
          path: release-assets
          merge-multiple: true
      - name: Publish dependencies before adapters and launcher
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          native=(
            release-assets/antepodeum-linguini-{darwin-arm64,darwin-x64,linux-arm64,linux-x64,win32-arm64,win32-x64}-*.tgz
          )
          if (( ${#native[@]} != 6 )); then
            printf 'Expected 6 native packages, found %s.\n' "${#native[@]}" >&2
            exit 1
          fi
          launcher=(release-assets/antepodeum-linguini-[0-9]*.tgz)
          if (( ${#launcher[@]} != 1 )); then
            printf 'Expected 1 launcher package, found %s.\n' "${#launcher[@]}" >&2
            exit 1
          fi
          shared=(release-assets/antepodeum-linguini-project-*.tgz)
          if (( ${#shared[@]} != 1 )); then
            printf 'Expected 1 shared configuration package, found %s.\n' "${#shared[@]}" >&2
            exit 1
          fi
          npm publish "${shared[0]}" --access public --provenance
          for package in "${native[@]}"; do
            npm publish "$package" --access public --provenance
          done
          npm publish "${launcher[0]}" --access public --provenance
          for name in web vite svelte vue tsc sveltekit; do
            packages=(release-assets/antepodeum-linguini-"$name"-*.tgz)
            if (( ${#packages[@]} != 1 )); then
              printf 'Expected 1 %s package, found %s.\n' "$name" "${#packages[@]}" >&2
              exit 1
            fi
            npm publish "${packages[0]}" --access public --provenance
          done
