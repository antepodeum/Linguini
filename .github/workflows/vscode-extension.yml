name: Native packages and VS Code extension

on:
  workflow_dispatch:
    inputs:
      publish_ovsx:
        description: Publish platform VSIX packages to Open VSX
        type: boolean
        default: false
      publish_npm:
        description: Publish native CLI packages to npm
        type: boolean
        default: false
  push:
    tags:
      - 'v*'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

permissions:
  contents: read

jobs:
  package-native:
    name: Package ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x64
            runner: ubuntu-24.04
            rust_target: x86_64-unknown-linux-gnu
            binary: target/x86_64-unknown-linux-gnu/release/linguini
          - platform: linux-arm64
            runner: ubuntu-24.04-arm
            rust_target: aarch64-unknown-linux-gnu
            binary: target/aarch64-unknown-linux-gnu/release/linguini
          - platform: darwin-x64
            runner: macos-15-intel
            rust_target: x86_64-apple-darwin
            binary: target/x86_64-apple-darwin/release/linguini
          - platform: darwin-arm64
            runner: macos-15
            rust_target: aarch64-apple-darwin
            binary: target/aarch64-apple-darwin/release/linguini
          - platform: win32-x64
            runner: windows-2025
            rust_target: x86_64-pc-windows-msvc
            binary: target/x86_64-pc-windows-msvc/release/linguini.exe
          - platform: win32-arm64
            runner: windows-11-arm
            rust_target: aarch64-pc-windows-msvc
            binary: target/aarch64-pc-windows-msvc/release/linguini.exe
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.93.1
          targets: ${{ matrix.rust_target }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Verify release versions
        run: node packages/scripts/check-versions.mjs
      - name: Build native CLI and LSP
        run: cargo build --locked --release -p linguini-cli --target ${{ matrix.rust_target }}
      - name: Stage checksummed native npm package
        run: node packages/scripts/stage-native-package.mjs ${{ matrix.platform }} ${{ matrix.binary }}
      - name: Pack native npm package
        working-directory: packages/cli-${{ matrix.platform }}
        run: npm pack --pack-destination ../../release
      - name: Pack launcher npm package
        if: matrix.platform == 'linux-x64'
        working-directory: packages/cli
        run: npm test && npm pack --pack-destination ../../release
      - name: Install extension dependencies
        working-directory: editors/vscode
        run: npm ci
      - name: Test extension
        working-directory: editors/vscode
        run: npm test
      - name: Package platform VSIX
        working-directory: editors/vscode
        env:
          VSCE_TARGET: ${{ matrix.platform }}
          LINGUINI_SERVER_BINARY: ../../${{ matrix.binary }}
        run: npm run package:vsix
      - name: Smoke test real Extension Host
        if: matrix.platform == 'linux-x64'
        working-directory: editors/vscode
        run: xvfb-run -a npm run test:integration
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linguini-${{ matrix.platform }}
          path: |
            release/*.tgz
            editors/vscode/dist/*.vsix
          if-no-files-found: error
          retention-days: 30

  publish-ovsx:
    name: Publish Open VSX
    runs-on: ubuntu-24.04
    needs: package-native
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_ovsx)
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - run: npm ci
        working-directory: editors/vscode
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: linguini-*
          path: release-assets
          merge-multiple: true
      - name: Publish target-specific VSIX packages
        shell: bash
        working-directory: editors/vscode
        run: |
          set -euo pipefail
          if [[ -z "${OVSX_PAT:-}" ]]; then
            echo 'Missing repository secret OVSX_PAT.' >&2
            exit 1
          fi
          shopt -s nullglob
          files=(../../release-assets/*.vsix)
          if (( ${#files[@]} != 6 )); then
            printf 'Expected 6 VSIX files, found %s.\n' "${#files[@]}" >&2
            exit 1
          fi
          for vsix in "${files[@]}"; do
            npx --no-install ovsx publish "$vsix"
          done

  publish-npm:
    name: Publish native npm packages
    runs-on: ubuntu-24.04
    needs: package-native
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'workflow_dispatch' && inputs.publish_npm)
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: linguini-*
          path: release-assets
          merge-multiple: true
      - name: Publish platform packages before launcher
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          native=(
            release-assets/linguini-cli-{darwin-arm64,darwin-x64,linux-arm64,linux-x64,win32-arm64,win32-x64}-*.tgz
          )
          if (( ${#native[@]} != 6 )); then
            printf 'Expected 6 native packages, found %s.\n' "${#native[@]}" >&2
            exit 1
          fi
          for package in "${native[@]}"; do
            npm publish "$package" --access public --provenance
          done
          launcher=(release-assets/linguini-cli-[0-9]*.tgz)
          if (( ${#launcher[@]} != 1 )); then
            printf 'Expected 1 launcher package, found %s.\n' "${#launcher[@]}" >&2
            exit 1
          fi
          npm publish "${launcher[0]}" --access public --provenance
